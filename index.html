<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายรับ-รายจ่าย</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#ec3013" id="themeColorMeta">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --color-bg: #f3f2f2;
    --color-surface: #eae9e9;
    --color-text: #201e1d;
    --color-muted: color-mix(in srgb, #201e1d 55%, transparent);
    --color-divider: color-mix(in srgb, #201e1d 40%, transparent);
    --color-accent: #ec3013;
    --color-accent-600: #dd2b0f;
    --color-accent-700: #ae1800;
    --color-income: #2f6b3f;
    --color-expense: #ae1800;
    --font-heading: "Archivo", system-ui, sans-serif;
    --font-body: "Archivo", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--color-bg); color: var(--color-text); font-family: var(--font-body);
    font-size: 15px; line-height: 1.5;
  }
  h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: 800; margin: 0; letter-spacing: -0.015em; }
  a { color: var(--color-accent); }

  .app { display: flex; flex-direction: column; min-height: 100vh; }
  .app-header {
    text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center;
    max-width: 480px; margin: 0 auto; width: 100%; padding: 28px 20px 8px;
  }
  .app-header h1 { font-size: 26px; }
  .app-header p { margin: 0; color: var(--color-muted); font-size: 13px; line-height: 1.5; max-width: 380px; }

  .screen { flex: 1; max-width: 480px; margin: 0 auto; width: 100%; padding: 4px 20px 96px; box-sizing: border-box; }

  /* — buttons — */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; text-decoration: none;
    font-family: var(--font-heading); font-weight: 800; font-size: 14px; line-height: 1.2;
    color: var(--color-text); background: transparent; border: 1px solid transparent;
    padding: 9px 15px; border-radius: 0;
  }
  .btn svg { display: block; flex-shrink: 0; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--color-accent); color: #fff; }
  .btn-primary:hover { background: var(--color-accent-600); }
  .btn-primary:active { background: var(--color-accent-700); }
  .btn-secondary { border-color: var(--color-divider); }
  .btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
  .btn-ghost { color: var(--color-accent); padding-inline: 4px; }
  .btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
  .btn-icon { width: 30px; height: 30px; padding: 0; }
  .btn-block { width: 100%; margin-top: 8px; }

  /* — forms — */
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > label { font-size: 12px; color: color-mix(in srgb, var(--color-text) 70%, transparent); }
  .input {
    width: 100%; min-height: 38px; padding: 7px 10px; font: inherit; font-size: 15px;
    color: var(--color-text); background: var(--color-surface);
    border: 1px solid var(--color-divider); border-radius: 0;
  }
  .input:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 0; }
  .seg { display: inline-flex; overflow: hidden; border: 1px solid var(--color-divider); width: 100%; }
  .seg-opt {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: 1;
    padding: 8px 10px; font-size: 13px; cursor: pointer;
  }
  .seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
  .seg-opt input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
  .seg-opt:has(input:checked) { background: var(--color-accent); color: #fff; }
  .seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }

  /* — home — */
  .today-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-muted); }
  .balance-card { margin: 12px 0 20px; background: var(--color-accent); color: #fff; padding: 20px; }
  .balance-card .kicker { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.85; }
  .balance-card .amount { font-size: 34px; font-weight: 800; font-family: var(--font-heading); margin-top: 4px; }
  .balance-card .rule { height: 2px; background: rgba(255,255,255,0.35); margin: 16px 0; }
  .balance-card .split { display: flex; gap: 24px; }
  .balance-card .split .lbl { font-size: 11px; opacity: 0.85; }
  .balance-card .split .val { font-size: 16px; font-weight: 600; margin-top: 2px; }

  .section-head { margin: 20px 0 6px; display: flex; align-items: center; justify-content: space-between; }
  .section-head h3 { font-size: 15px; font-weight: 800; }
  .section-head:first-of-type { margin-top: 0; }

  .tx-list { border-top: 2px solid var(--color-divider); }
  .tx-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--color-divider); gap: 10px; }
  .tx-row .info { min-width: 0; flex: 1; }
  .tx-row .cat { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx-row .meta { font-size: 11.5px; color: var(--color-muted); }
  .tx-row .amt { font-size: 14px; font-weight: 600; flex-shrink: 0; }
  .tx-row .actions { display: flex; gap: 2px; flex-shrink: 0; }
  .empty-note { padding: 36px 0; text-align: center; color: var(--color-muted); font-size: 13px; }

  .budget-item .row1 { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 5px; }
  .budget-item .row1 .right { color: var(--color-muted); }
  .bar-track { height: 6px; background: var(--color-surface); }
  .bar-fill { height: 100%; }
  .budgets-list { display: flex; flex-direction: column; gap: 12px; }

  /* — transactions filters — */
  .filter-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .filter-row .input { flex: 1; }

  /* — add form — */
  .add-form { display: flex; flex-direction: column; gap: 14px; }
  .date-input-wrap { position: relative; }
  .date-input-wrap .input { padding-right: 38px; }
  .date-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--color-muted); }
  .date-native-overlay { position: absolute; right: 0; top: 0; width: 38px; height: 100%; opacity: 0; cursor: pointer; border: none; padding: 0; margin: 0; }

  /* — insights — */
  .insight-card { border: 1px solid var(--color-divider); padding: 14px; }
  .insight-card .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .insight-card .head .cat { font-weight: 600; font-size: 14px; }
  .insight-card .head .status { font-size: 11.5px; }
  .insight-card .foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--color-muted); margin-top: 8px; }
  .insight-cards { display: flex; flex-direction: column; gap: 16px; padding-bottom: 16px; }

  .breakdown-row { margin-bottom: 12px; }
  .breakdown-row .row1 { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 5px; }
  .breakdown-row .row1 .right { color: var(--color-muted); }
  .breakdown-bar-track { height: 14px; background: var(--color-surface); }
  .legend-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  .trend-legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--color-muted); margin-bottom: 14px; }
  .trend-legend .swatch { display: inline-block; width: 8px; height: 8px; margin-right: 5px; vertical-align: middle; }
  .trend-chart { display: flex; align-items: flex-end; gap: 10px; height: 150px; border-bottom: 2px solid var(--color-divider); padding-bottom: 2px; }
  .trend-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .trend-bars { display: flex; gap: 3px; align-items: flex-end; height: 100%; }
  .trend-bars .bar { width: 9px; }
  .trend-labels { display: flex; gap: 10px; margin-top: 6px; }
  .trend-labels div { flex: 1; text-align: center; font-size: 10.5px; color: var(--color-muted); }

  /* — settings — */
  .settings-block { display: flex; flex-direction: column; gap: 22px; padding-bottom: 24px; }
  .settings-section-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 8px; }
  .profile-row { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--color-surface); display: flex; align-items: center; justify-content: center; font-weight: 800; font-family: var(--font-heading); font-size: 18px; flex-shrink: 0; object-fit: cover; }
  .profile-name { font-weight: 600; font-size: 15px; }
  .profile-sub { font-size: 12px; color: var(--color-muted); }
  .profile-row .btn { margin-left: auto; }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--color-divider); padding: 12px 14px; margin-bottom: 8px; }
  .toggle-switch { width: 44px; height: 24px; background: var(--color-surface); border: none; padding: 2px; cursor: pointer; position: relative; box-sizing: border-box; }
  .toggle-switch.on { background: var(--color-accent); }
  .toggle-switch .thumb { display: block; width: 18px; height: 18px; background: #fff; transition: transform 0.15s; }
  .toggle-switch.on .thumb { transform: translateX(20px); }

  .scheme-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .scheme-opt { flex: 1 1 30%; min-width: 96px; display: flex; align-items: center; gap: 7px; border: 1px solid var(--color-divider); padding: 10px; cursor: pointer; }
  .scheme-opt.active { border-color: var(--swatch); }
  .scheme-opt input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
  .scheme-opt .dot { width: 14px; height: 14px; background: var(--swatch); flex-shrink: 0; }
  .scheme-opt .lbl { font-size: 12.5px; }

  .sync-box { border: 1px solid var(--color-divider); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  #syncStatus { font-size: 12.5px; color: var(--color-muted); display: flex; align-items: center; gap: 6px; }
  #syncStatus.ok { color: var(--color-income); }
  #syncStatus.err { color: var(--color-expense); }
  .sync-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--color-muted); flex-shrink: 0; }
  #syncStatus.ok .sync-dot { background: var(--color-income); }
  #syncStatus.err .sync-dot { background: var(--color-expense); }

  .bills-list, .budgets-manage-list { border-top: 2px solid var(--color-divider); }
  .manage-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--color-divider); gap: 10px; }
  .manage-row .info { min-width: 0; flex: 1; }
  .manage-row .name { font-size: 14px; font-weight: 600; }
  .manage-row .sub { font-size: 11.5px; color: var(--color-muted); }
  .manage-row .amt { font-size: 14px; font-weight: 600; flex-shrink: 0; }
  .row-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .section-add-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .inline-form { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--color-divider); padding: 12px; margin-bottom: 12px; }
  .inline-form .actions-row { display: flex; gap: 8px; }
  .inline-form .actions-row .btn { flex: 1; }

  .footer-note { font-size: 11px; line-height: 1.6; color: var(--color-muted); margin: 4px 0 0; }

  /* — tab bar — */
  .tabbar-wrap { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; background: var(--color-bg); border-top: 2px solid var(--color-divider); z-index: 30; }
  .tabbar { display: flex; width: 100%; max-width: 480px; }
  .tabbar button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 0 8px; background: none; border: none; cursor: pointer; color: var(--color-muted);
    font-family: var(--font-body);
  }
  .tabbar button.active { color: var(--color-accent); }
  .tabbar button span { font-size: 10px; font-weight: 600; }

  .toast {
    position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%);
    background: var(--color-text); color: var(--color-bg); padding: 10px 16px; font-size: 12.5px;
    z-index: 40; max-width: 420px; width: calc(100% - 40px);
    display: flex; align-items: center; justify-content: center; gap: 14px;
  }
  .toast[hidden] { display: none; }
  .toast-undo-btn {
    background: none; border: none; padding: 0; min-height: 0; flex-shrink: 0;
    color: var(--color-bg); font-family: var(--font-heading); font-weight: 800;
    font-size: 12.5px; text-decoration: underline; cursor: pointer;
  }

  @media (min-width: 560px) {
    .app-header, .screen, .tabbar { max-width: 480px; }
    .app { background: var(--color-surface); }
    .screen, .app-header { background: var(--color-bg); }
  }

  /* — desktop: sidebar nav instead of a bottom bar, wider content — */
  @media (min-width: 880px) {
    .tabbar-wrap {
      left: 0; right: auto; top: 0; bottom: 0; width: 232px;
      border-top: none; border-right: 2px solid var(--color-divider); padding-top: 12px;
    }
    .tabbar { flex-direction: column; width: 100%; max-width: none; gap: 2px; padding: 0 12px; }
    .tabbar button {
      flex-direction: row; justify-content: flex-start; gap: 12px;
      padding: 11px 12px; border-radius: 0;
    }
    .tabbar button span { font-size: 13.5px; }
    .tabbar button.active { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
    .app-header, .screen { max-width: 640px; margin-left: 264px; margin-right: auto; }
    .screen { padding-bottom: 60px; }
    .toast { left: calc(50% + 116px); }
  }
</style>
</head>
<body>
<div class="app">

  <header class="app-header">
    <h1 id="appTitle"></h1>
    <p id="appSubtitle"></p>
  </header>

  <main class="screen" id="screen"></main>

  <div class="toast" id="toast" hidden></div>

  <div class="tabbar-wrap">
    <nav class="tabbar" id="tabbar">
      <button type="button" data-tab="home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span data-l="tabHome"></span>
      </button>
      <button type="button" data-tab="transactions">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        <span data-l="tabTx"></span>
      </button>
      <button type="button" data-tab="add">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <span data-l="tabAdd"></span>
      </button>
      <button type="button" data-tab="insights">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        <span data-l="tabInsights"></span>
      </button>
      <button type="button" data-tab="settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
        <span data-l="tabSettings"></span>
      </button>
    </nav>
  </div>

</div>

<script>
(function () {
  "use strict";

  // ---------- categories & keyword auto-categorize ----------
  const CATEGORIES = {
    income: ["เงินเดือน", "โบนัส/รายได้พิเศษ", "ธุรกิจ/ฟรีแลนซ์", "ดอกเบี้ย/เงินลงทุน", "อื่นๆ (รายรับ)"],
    expense: ["อาหารและเครื่องดื่ม", "การเดินทาง", "ที่อยู่อาศัย/ค่าเช่า", "สาธารณูปโภค (ไฟ/น้ำ/เน็ต)", "ช้อปปิ้ง", "บันเทิง", "สุขภาพ", "การศึกษา", "ผ่อนชำระ/หนี้สิน", "ออมเงิน/ลงทุน", "อื่นๆ (รายจ่าย)"]
  };
  const CATEGORY_KEYWORDS = {
    expense: [
      ["อาหารและเครื่องดื่ม", ["ข้าว", "กาแฟ", "อาหาร", "กิน", "ก๋วยเตี๋ยว", "ชานม", "เครื่องดื่ม", "สตาร์บัค", "บุฟเฟ่ต์", "ร้านอาหาร", "ของกิน", "ขนม", "ก๋วยจั๊บ", "ส้มตำ"]],
      ["การเดินทาง", ["แท็กซี่", "taxi", "bts", "mrt", "รถไฟฟ้า", "น้ำมัน", "วินมอไซค์", "grab", "แกร็บ", "ค่ารถ", "ทางด่วน", "ที่จอดรถ", "ตั๋วเครื่องบิน", "รถทัวร์"]],
      ["ที่อยู่อาศัย/ค่าเช่า", ["ค่าเช่า", "ค่าห้อง", "ค่าบ้าน", "หอพัก", "คอนโด"]],
      ["สาธารณูปโภค (ไฟ/น้ำ/เน็ต)", ["ค่าไฟ", "ค่าน้ำ", "ค่าเน็ต", "อินเทอร์เน็ต", "ไวไฟ", "wifi", "ค่ามือถือ", "ค่าโทรศัพท์"]],
      ["ช้อปปิ้ง", ["ช้อปปิ้ง", "ซื้อของ", "เสื้อผ้า", "shopee", "lazada", "ช็อปปี้", "ลาซาด้า", "รองเท้า"]],
      ["บันเทิง", ["หนัง", "เกม", "คอนเสิร์ต", "netflix", "ดูหนัง", "เที่ยว", "สวนสนุก"]],
      ["สุขภาพ", ["หมอ", "ยา", "โรงพยาบาล", "คลินิก", "ฟิตเนส", "ประกันสุขภาพ"]],
      ["การศึกษา", ["เรียน", "หนังสือ", "คอร์ส", "ค่าเทอม", "อบรม"]],
      ["ผ่อนชำระ/หนี้สิน", ["ผ่อน", "หนี้", "บัตรเครดิต", "สินเชื่อ"]],
      ["ออมเงิน/ลงทุน", ["ออมเงิน", "ลงทุน", "หุ้น", "กองทุน"]]
    ],
    income: [
      ["เงินเดือน", ["เงินเดือน", "salary"]],
      ["โบนัส/รายได้พิเศษ", ["โบนัส", "bonus", "รายได้พิเศษ"]],
      ["ธุรกิจ/ฟรีแลนซ์", ["ฟรีแลนซ์", "freelance", "ธุรกิจ", "ขายของ"]],
      ["ดอกเบี้ย/เงินลงทุน", ["ดอกเบี้ย", "ปันผล"]]
    ]
  };
  function guessCategory(note, type) {
    if (!note) return null;
    const text = note.toLowerCase();
    for (const [cat, words] of (CATEGORY_KEYWORDS[type] || [])) {
      if (words.some((w) => text.includes(w.toLowerCase()))) return cat;
    }
    return null;
  }

  const SCHEMES = {
    red: ["#ec3013", "#dd2b0f", "#ae1800"],
    orange: ["#c56a1f", "#a8591a", "#7c4110"],
    amber: ["#a16207", "#854d0e", "#713f12"],

  function rowToGoal(r) { return { id: r.id, name: r.name, target: Number(r.target_amount), saved: Number(r.saved_amount), updatedAt: new Date(r.updated_at).getTime() }; }
  function goalToRow(g, deleted) {

  async function pushRows(table, rows) {
    if (!sb || !currentUser || !rows.length) return true;
    try {
      const { error } = await sb.from(table).upsert(rows);
      if (error) throw error;
      return true;
    } catch (e) { return false; }
  }
  async function pushTx(t) { return pushRows("transactions", [txToRow(t, false)]); }
  async function pushDeleteTx(t) { return pushRows("transactions", [txToRow(t, true)]); }

  async function pullTransactions() {
    if (!sb || !currentUser) return false;
    try {
      const { data, error } = await sb.from("transactions").select("*").eq("user_id", currentUser.id);
      if (error) throw error;
      const byId = new Map(transactions.map((t) => [t.id, t]));
      (data || []).forEach((r) => {
        const rTime = new Date(r.updated_at).getTime();
        if (r.deleted) { byId.delete(r.id); return; }
        const local = byId.get(r.id);
        if (!local || (local.updatedAt || 0) < rTime) byId.set(r.id, rowToTx(r));
      });
      transactions = Array.from(byId.values());
      saveToStorage();
      return true;
    } catch (e) { return false; }
  }
  async function pullBudgets() {
    if (!sb || !currentUser) return false;
    try {
      const { data, error } = await sb.from("budgets").select("*").eq("user_id", currentUser.id);
      if (error) throw error;
      if (!data || !data.length) return true;
      const byCat = new Map(budgets.map((b) => [b.category, b]));
      data.forEach((r) => {
        if (r.deleted) return;
        byCat.set(r.category, budgetRowToObj(r));
      });
      budgets = Array.from(byCat.values());
      saveSettings();

  // True while the user has an uncontrolled form open/focused that a full
  // screen re-render would silently reset mid-edit (Add screen, budget/bill
  // inline forms, or any focused field in the current screen).
  function hasLiveInputRisk() {
    if (state.tab === "add") return true;
    if (state.budgetEditId || state.billEditId || state.goalEditId || state.goalContributeId) return true;
    const active = document.activeElement;
    const screenEl = $("screen");
    if (active && screenEl && screenEl.contains(active) && /^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName)) return true;
    return false;
  }

  let syncInFlight = false;
  async function syncNow() {
    if (!sb) { setSyncStatus("cloud sync unavailable", false); return; }
    if (!currentUser) { setSyncStatus(L().syncSignedOut, null); return; }
    if (syncInFlight) return;
    if (typeof navigator !== "undefined" && navigator.onLine === false) {
      setSyncStatus(L().syncOffline, false);
      return;
    }
    syncInFlight = true;
    setSyncStatus(L().syncSyncing, null);
    // Pull first: a device/session that hasn't yet learned about a deletion
    // made elsewhere still holds the old (or hardcoded default) row locally.
    // Pushing that stale copy before pulling would re-upload it with a fresh
    // timestamp and silently resurrect it in the cloud (and everywhere else).
    const pullTxOk = await pullTransactions();
    const pullBudgetOk = await pullBudgets();
    const pullBillOk = await pullBills();
    const pullGoalOk = await pullGoals();
    const pushTxOk = await pushRows("transactions", transactions.map((t) => txToRow(t, false)));
    const pushBudgetOk = await pushRows("budgets", budgets.map((b) => budgetToRow(b, false)));
    const pushBillOk = await pushRows("bills", bills.map((b) => billToRow(b, false)));
    const pushGoalOk = await pushRows("goals", goals.map((g) => goalToRow(g, false)));
    if (pushTxOk && pushBudgetOk && pushBillOk && pushGoalOk && pullTxOk && pullBudgetOk && pullBillOk && pullGoalOk) {
      setSyncStatus(L().syncLatest + new Date().toLocaleTimeString(state.lang === "en" ? "en-US" : "th-TH"), true);
      if (!hasLiveInputRisk()) renderScreen();
    } else {
      setSyncStatus(L().syncPartial, false);
    }
    syncInFlight = false;
  }

  // ---------- derived data ----------
  function computeBudgets(forMonth) {
    const targetMonth = forMonth || new Date().toISOString().slice(0, 7);
    const spentByCategory = {};
    transactions.filter((t) => t.type === "expense" && monthKey(t.date) === targetMonth).forEach((t) => {
      spentByCategory[t.category] = (spentByCategory[t.category] || 0) + t.amount;
    });
    return budgets.map((b) => {
      const spent = spentByCategory[b.category] || 0;
      const pct = Math.min(100, Math.round((spent / b.limit) * 100));
      const over = spent > b.limit;
      const near = !over && spent / b.limit >= 0.8;
      return {
        category: b.category, spentFmt: fmtMoney(spent), limitFmt: fmtMoney(b.limit), pct,
        barColor: over ? "var(--color-accent-700)" : (near ? "var(--color-warning)" : "var(--color-accent)"),
        statusColor: over ? "var(--color-accent-700)" : (near ? "var(--color-warning)" : "var(--color-muted)"),
        statusLabel: over ? L().overBudget : pct + "%"
      };
    });
  }
  // Returns an alert message if adding/editing `tx` pushed its budget category
  // to 80%+ of its monthly limit, or null if no budget applies / still under.
  function checkBudgetAlert(tx) {
    if (!tx || tx.type !== "expense") return null;
    const curMonthKey = new Date().toISOString().slice(0, 7);
    if (monthKey(tx.date) !== curMonthKey) return null;
    const budget = budgets.find((b) => b.category === tx.category);
    if (!budget) return null;
    const spent = transactions.filter((t) => t.type === "expense" && t.category === tx.category && monthKey(t.date) === curMonthKey).reduce((a, t) => a + t.amount, 0);
    if (spent >= budget.limit) return L().toastBudgetOver.replace("{cat}", tx.category);
    if (spent / budget.limit >= 0.8) return L().toastBudgetNear.replace("{cat}", tx.category);
    return null;
  }
  // A bill's `day` recurs every month; find its next occurrence (today counts
  // as due) and how many days away that is.
  function nextBillDueDate(day) {
    const now = new Date();
    let dueMonth = now.getMonth(), dueYear = now.getFullYear();
    if (day < now.getDate()) {
      dueMonth += 1;
      if (dueMonth > 11) { dueMonth = 0; dueYear += 1; }
    }
    const lastDayOfMonth = new Date(dueYear, dueMonth + 1, 0).getDate();
    return new Date(dueYear, dueMonth, Math.min(day, lastDayOfMonth));
  }
  function daysUntilBillDue(day) {
    const due = nextBillDueDate(day);
    due.setHours(0, 0, 0, 0);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return Math.round((due - today) / 86400000);
  }
  function dueSoonLabel(n) {
    if (n === 0) return L().dueToday;
    if (n === 1) return L().dueTomorrow;
    return L().dueInDays.replace("{n}", n);
  }
  function upcomingBills() {
    return bills
      .map((b) => Object.assign({}, b, { daysUntil: daysUntilBillDue(b.day) }))
      .filter((b) => b.daysUntil <= 7)
      .sort((a, b) => a.daysUntil - b.daysUntil);
  }
  function markBillPaid(id) {
    const bill = bills.find((b) => b.id === id);
    if (!bill) return;
    const savedTx = {
      id: uid(), type: "expense", date: new Date().toISOString().slice(0, 10),
      category: bill.category || CATEGORIES.expense[CATEGORIES.expense.length - 1],
      amount: bill.amount, note: bill.name, updatedAt: Date.now()
    };
    transactions.push(savedTx);
    saveToStorage();
    renderScreen();
    showToast(checkBudgetAlert(savedTx) || L().toastAdded);
    pushTx(savedTx).then(() => syncNow());
  }
  const CHART_COLORS = ["#ec3013", "#c56a1f", "#a16207", "#3d7a3f", "#0d9488", "#3763b5", "#4f46e5", "#7c3aed", "#be185d", "#2d2b2b"];
  function computeBreakdown(forMonth) {
    const targetMonth = forMonth || new Date().toISOString().slice(0, 7);
    const totals = {};
    transactions.filter((t) => t.type === "expense" && monthKey(t.date) === targetMonth).forEach((t) => {
      totals[t.category] = (totals[t.category] || 0) + t.amount;
    });
    const entries = Object.entries(totals).sort((a, b) => b[1] - a[1]).slice(0, 6);
    const max = entries.length ? entries[0][1] : 1;
    const sum = entries.reduce((a, [, v]) => a + v, 0) || 1;
    return entries.map(([cat, total], i) => ({
      category: cat, total, totalFmt: fmtMoney(total),
      pct: Math.max(4, Math.round((total / max) * 100)),
      sharePct: (total / sum) * 100,
      color: CHART_COLORS[i % CHART_COLORS.length]
    }));
  }
  function pieChartSvg(entries) {
    const total = entries.reduce((a, e) => a + e.total, 0) || 1;
    const r = 52, cx = 60, cy = 60, sw = 22, circ = 2 * Math.PI * r;
    let offset = 0;
    const circles = entries.map((e) => {
      const dash = (e.total / total) * circ;
      const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${e.color}" stroke-width="${sw}" stroke-dasharray="${dash} ${circ - dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
      offset += dash;
      return el;
    }).join("");
    return `<svg width="120" height="120" viewBox="0 0 120 120">${circles}</svg>`;
  }
  function insightsMonthOptions() {
    const keys = new Set(transactions.map((t) => monthKey(t.date)));
    keys.add(state.insightsMonth);
    keys.add(new Date().toISOString().slice(0, 7));
    return Array.from(keys).sort().reverse();
  }
  function computeTrend() {
    const byMonth = {};
    transactions.forEach((t) => { const k = monthKey(t.date); byMonth[k] = byMonth[k] || { income: 0, expense: 0 }; byMonth[k][t.type] += t.amount; });
    const keys = Object.keys(byMonth).sort().slice(-6);
    const max = Math.max(1, ...keys.map((k) => Math.max(byMonth[k].income, byMonth[k].expense)));
    return keys.map((k) => ({
      label: monthLabel(k),
      incomeH: Math.max(2, Math.round((byMonth[k].income / max) * 130)),
      expenseH: Math.max(2, Math.round((byMonth[k].expense / max) * 130))
    }));
  }

    }
    document.querySelectorAll('input[name="form-type"]').forEach((r) => r.addEventListener("change", (e) => {
      state.formType = e.target.value;
      const guess = state.categoryManual ? state.formCategory : guessCategory($("txNote").value, state.formType);
      const opts = state.formType === "income" ? CATEGORIES.income : CATEGORIES.expense;
      state.formCategory = (guess && opts.includes(guess)) ? guess : opts[0];
      renderFormCategoryOptions($("txCategory"));
    }));
    $("txCategory").addEventListener("change", (e) => { state.formCategory = e.target.value; state.categoryManual = true; });
    $("txDateText").addEventListener("input", function () { this.value = formatDateTyping(this.value); });
    $("txDateText").addEventListener("change", function () {
      const iso = parseDateText(this.value);
      if (iso) { state.formDate = iso; $("txDateNative").value = iso; }
      else { this.value = dateLabel(state.formDate); }
    });
    $("txDateNative").addEventListener("change", function () {
      if (this.value) { state.formDate = this.value; $("txDateText").value = dateLabel(this.value); }
    });
    $("txNote").addEventListener("input", function () {
      if (state.categoryManual) return;
      const guess = guessCategory(this.value, state.formType);
      if (guess) { state.formCategory = guess; $("txCategory").value = guess; }
    });
    if (isEditing) $("cancelEditBtn").addEventListener("click", () => { resetForm(); setTab("transactions"); });
    $("addForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const date = state.formDate;
      const amount = parseFloat($("txAmount").value);
      if (!date || !amount || amount <= 0) { showToast(L().toastInvalidAmount); return; }
      const note = $("txNote").value.trim();
      const category = $("txCategory").value;
      let savedTx = null;
      if (state.editingId) {
        const idx = transactions.findIndex((t) => t.id === state.editingId);
        if (idx >= 0) {
          transactions[idx] = Object.assign({}, transactions[idx], { type: state.formType, date, category, amount, note, updatedAt: Date.now() });
          savedTx = transactions[idx];
        }
        showToast(L().toastEdited);
      } else {
        savedTx = { id: uid(), type: state.formType, date, category, amount, note, updatedAt: Date.now() };
        transactions.push(savedTx);
        showToast(checkBudgetAlert(savedTx) || L().toastAdded);
      }
      saveToStorage();
      resetForm();
      setTab("transactions");
      if (savedTx) pushTx(savedTx).then(() => syncNow());
    });
  }

          <div class="seg" role="radiogroup">
            <label class="seg-opt"><input type="radio" name="lang-switch" value="th" ${state.lang === "th" ? "checked" : ""}>ไทย</label>
            <label class="seg-opt"><input type="radio" name="lang-switch" value="en" ${state.lang === "en" ? "checked" : ""}>English</label>
          </div>
        </div>

        <div>
          <div class="settings-section-label">${escapeHtml(l.displaySection)}</div>
          <div class="toggle-row">
            <span style="font-size:14px">${escapeHtml(l.darkModeBtn)}</span>
            <button type="button" class="toggle-switch ${state.dark ? "on" : ""}" id="darkSwitch"><span class="thumb"></span></button>
          </div>
          <div class="scheme-grid">
            ${SCHEME_ORDER.map((s) => `
              <label class="scheme-opt ${state.scheme === s ? "active" : ""}" style="--swatch:${SCHEMES[s][0]}">
                <input type="radio" name="color-scheme" value="${s}" ${state.scheme === s ? "checked" : ""}>
                <span class="dot"></span>
                <span class="lbl">${escapeHtml(l["color" + s.charAt(0).toUpperCase() + s.slice(1)])}</span>
              </label>`).join("")}
            <label class="scheme-opt ${state.scheme === "custom" ? "active" : ""}" style="--swatch:${state.customColor}">
              <input type="color" id="customColorPicker" value="${state.customColor}">
              <span class="dot"></span>
              <span class="lbl">${escapeHtml(l.colorCustom)}</span>
            </label>
          </div>
        </div>

        <div>
          <div class="settings-section-label">${escapeHtml(l.syncSection)}</div>
          <div class="sync-box">
            <span id="syncStatus" class="${lastSyncStatus.ok === true ? "ok" : (lastSyncStatus.ok === false ? "err" : "")}"><span class="sync-dot"></span><span>${escapeHtml(currentUser ? lastSyncStatus.text : l.syncSignedOut)}</span></span>
            <div style="font-size:11.5px;color:var(--color-muted)">${escapeHtml(l.syncHelp)}</div>
            <button type="button" class="btn btn-secondary" id="syncNowBtn" ${currentUser ? "" : "disabled"}>${escapeHtml(l.syncNowBtn)}</button>
          </div>
        </div>

        ${deferredInstallPrompt ? `
        <div>
          <button type="button" class="btn btn-primary btn-block" id="installAppBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            ${escapeHtml(l.installAppBtn)}
          </button>
        </div>` : ""}

        <div>
          <div class="settings-section-label">${escapeHtml(l.dataSection)}</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <button type="button" class="btn btn-secondary btn-block" id="exportCsvBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              ${escapeHtml(l.exportCsvBtn)}
            </button>
            <button type="button" class="btn btn-secondary btn-block" id="exportJsonBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              ${escapeHtml(l.exportJsonBtn)}
            </button>
          </div>
        </div>

        <div>
          <div class="section-add-row">
            <div class="settings-section-label" style="margin:0">${escapeHtml(l.budgetsSection)}</div>
            <button type="button" class="btn btn-ghost" id="addBudgetBtn" style="padding:0;font-size:12px">${escapeHtml(l.addBudgetBtn)}</button>
          </div>
          <div id="budgetFormSlot">${budgetFormHtml()}</div>
          <div class="budgets-manage-list">
            ${budgets.map(budgetRowHtml).join("") || `<div class="empty-note">${escapeHtml(l.noBudgets)}</div>`}
          </div>
        </div>

        <div>
          <div class="section-add-row">
            <div class="settings-section-label" style="margin:0">${escapeHtml(l.billsSection)}</div>
            <button type="button" class="btn btn-ghost" id="addBillBtn" style="padding:0;font-size:12px">${escapeHtml(l.addBillBtn)}</button>
          </div>
          <div id="billFormSlot">${billFormHtml()}</div>
          <div class="bills-list">
            ${bills.map(billRowHtml).join("") || `<div class="empty-note">${escapeHtml(l.noBills)}</div>`}
          </div>
        </div>

        <div>
          <div class="section-add-row">
            <div class="settings-section-label" style="margin:0">${escapeHtml(l.goalsSection)}</div>
            <button type="button" class="btn btn-ghost" id="addGoalBtn" style="padding:0;font-size:12px">${escapeHtml(l.addGoalBtn)}</button>
          </div>
          <div id="goalFormSlot">${state.goalEditId ? goalFormHtml() : ""}</div>
          <div class="insight-cards" style="padding-bottom:0">
            ${goals.map(goalCardHtml).join("") || `<div class="empty-note">${escapeHtml(l.noGoals)}</div>`}
          </div>
        </div>

        <p class="footer-note">${escapeHtml(l.footerNote)}</p>
      </div>
    `;

    $("authBtn").addEventListener("click", () => { currentUser ? signOutUser() : signInWithGoogle(); });
    document.querySelectorAll('input[name="lang-switch"]').forEach((r) => r.addEventListener("change", (e) => { state.lang = e.target.value; saveSettings(); renderChrome(); renderScreen(); }));
    $("darkSwitch").addEventListener("click", () => { state.dark = !state.dark; saveSettings(); applyTheme(); renderScreen(); });
    document.querySelectorAll('input[name="color-scheme"]').forEach((r) => r.addEventListener("change", (e) => { state.scheme = e.target.value; saveSettings(); applyTheme(); renderScreen(); }));
    $("customColorPicker").addEventListener("change", (e) => {
      state.customColor = e.target.value;
      state.scheme = "custom";
      SCHEMES.custom = computeCustomScheme(state.customColor);
      saveSettings();
      applyTheme();
      renderScreen();
    });
    $("syncNowBtn").addEventListener("click", syncNow);
    if ($("installAppBtn")) $("installAppBtn").addEventListener("click", function () {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.finally(() => {
        deferredInstallPrompt = null;
        renderSettings();
      });
    });
    $("exportCsvBtn").addEventListener("click", function () {
      const header = ["วันที่", "ประเภท", "หมวดหมู่", "รายละเอียด", "จำนวนเงิน"];
      const rows = transactions.slice().sort((a, b) => a.date.localeCompare(b.date)).map((t) =>
        [t.date, t.type === "income" ? L().incomeLabel : L().expenseLabel, t.category, t.note || "", t.amount].map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(","));
      const blob = new Blob(["﻿" + header.join(",") + "\n" + rows.join("\n")], { type: "text/csv" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "transactions.csv";
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
      showToast(L().toastCsv);
    });
    $("exportJsonBtn").addEventListener("click", function () {
      const blob = new Blob([JSON.stringify(transactions, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "transactions.json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
      showToast(L().toastJson);
    });

    $("addBudgetBtn").addEventListener("click", () => { state.budgetEditId = "new"; renderSettings(); });
    document.querySelectorAll("[data-edit-budget]").forEach((btn) => btn.addEventListener("click", () => { state.budgetEditId = btn.getAttribute("data-edit-budget"); renderSettings(); }));
    document.querySelectorAll("[data-delete-budget]").forEach((btn) => btn.addEventListener("click", () => deleteBudget(btn.getAttribute("data-delete-budget"))));
    if ($("saveBudgetFormBtn")) $("saveBudgetFormBtn").addEventListener("click", saveBudgetForm);
    if ($("cancelBudgetFormBtn")) $("cancelBudgetFormBtn").addEventListener("click", () => { state.budgetEditId = null; renderSettings(); });

    $("addBillBtn").addEventListener("click", () => { state.billEditId = "new"; renderSettings(); });
    document.querySelectorAll("[data-edit-bill]").forEach((btn) => btn.addEventListener("click", () => { state.billEditId = btn.getAttribute("data-edit-bill"); renderSettings(); }));
    document.querySelectorAll("[data-delete-bill]").forEach((btn) => btn.addEventListener("click", () => deleteBill(btn.getAttribute("data-delete-bill"))));
    if ($("saveBillFormBtn")) $("saveBillFormBtn").addEventListener("click", saveBillForm);
    if ($("cancelBillFormBtn")) $("cancelBillFormBtn").addEventListener("click", () => { state.billEditId = null; renderSettings(); });

    $("addGoalBtn").addEventListener("click", () => { state.goalEditId = "new"; state.goalContributeId = null; renderSettings(); });
    document.querySelectorAll("[data-edit-goal]").forEach((btn) => btn.addEventListener("click", () => { state.goalEditId = btn.getAttribute("data-edit-goal"); state.goalContributeId = null; renderSettings(); }));
    document.querySelectorAll("[data-delete-goal]").forEach((btn) => btn.addEventListener("click", () => deleteGoal(btn.getAttribute("data-delete-goal"))));
    document.querySelectorAll("[data-contribute-goal]").forEach((btn) => btn.addEventListener("click", () => { state.goalContributeId = btn.getAttribute("data-contribute-goal"); state.goalEditId = null; renderSettings(); }));
    if ($("saveGoalFormBtn")) $("saveGoalFormBtn").addEventListener("click", saveGoalForm);
    if ($("cancelGoalFormBtn")) $("cancelGoalFormBtn").addEventListener("click", () => { state.goalEditId = null; renderSettings(); });
    if ($("saveContributeBtn")) $("saveContributeBtn").addEventListener("click", saveContribution);
    if ($("cancelContributeBtn")) $("cancelContributeBtn").addEventListener("click", () => { state.goalContributeId = null; renderSettings(); });
  }

  // ---------- tab routing ----------
  function setTab(tab) {
    state.tab = tab;
    renderScreen();
  }
  function renderScreen() {
    if (state.tab === "home") renderHome();
    else if (state.tab === "transactions") renderTransactions();
    else if (state.tab === "add") renderAdd();
    else if (state.tab === "insights") renderInsights();
    else if (state.tab === "settings") renderSettings();
    renderChrome();
  }

  // ---------- boot ----------
  loadFromStorage();
  applyTheme();
  renderScreen();

  document.querySelectorAll("#tabbar button").forEach((btn) => btn.addEventListener("click", () => {
    if (btn.getAttribute("data-tab") === "add") resetForm();
    setTab(btn.getAttribute("data-tab"));
  }));

  window.addEventListener("online", syncNow);
  window.addEventListener("offline", () => setSyncStatus(L().syncOffline, false));
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") syncNow(); });
  setInterval(syncNow, 25000);

  if (sb) {
    sb.auth.onAuthStateChange(function (event, session) {
      currentUser = session ? session.user : null;
      if (window.location.hash || window.location.search) {
        window.history.replaceState(null, "", window.location.origin + window.location.pathname);
      }
      if (state.tab === "settings" && !hasLiveInputRisk()) renderSettings();
      if (currentUser) syncNow();
    });
  }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    if (state.tab === "settings" && !hasLiveInputRisk()) renderSettings();
  });
  window.addEventListener("appinstalled", () => {
    deferredInstallPrompt = null;
    if (state.tab === "settings" && !hasLiveInputRisk()) renderSettings();
  });
})();
</script>
</body>
</html>
